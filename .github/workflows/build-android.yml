name: Build Android APK

# Temporarily disabled
# on:
#   push:
#     branches: [ main ]
#     tags: [ 'v*' ]
#   pull_request:
#     branches: [ main ]
#   workflow_dispatch:
on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile_client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakiRPG-Mobile
          path: mobile_client/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
