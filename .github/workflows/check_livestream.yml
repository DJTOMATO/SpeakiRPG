name: Check Oage Livestream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Livestream & Update movies.txt
        run: python .github/scripts/check_livestream.py

      - name: Commit & Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add movies.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update oage livestream url [skip ci]" && git push)
