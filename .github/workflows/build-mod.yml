name: Build SpeakiMod.js and distribute

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest

    steps:
      # Checkout the development branch
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install dependencies and build
      - name: Install dependencies
        run: npm ci

      - name: Build SpeakiMod.js
        run: npm run build-mod

      # Checkout the distribution branch into a separate directory
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: distribution
          token: ${{ secrets.GITHUB_TOKEN }}

      # Copy the generated files to main
      - name: Update distribution files
        run: |
          cp SpeakiMod.js distribution/SpeakiMod.js
          cp SpeakiMod.js.map distribution/SpeakiMod.js.map

      # Commit and push only if the files have changed
      - name: Commit and push
        working-directory: distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f SpeakiMod.js SpeakiMod.js.map

          if git diff --cached --quiet; then
            echo "No changes to distribute."
          else
            git commit -m "Build SpeakiMod.js from develop"
            git push origin main
          fi
