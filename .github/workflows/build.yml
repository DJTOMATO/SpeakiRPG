name: Build/Release Electron App

on:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_script: build:mac
            artifact_name: mac-installer
            artifact_path: dist/*.dmg
          - os: windows-latest
            build_script: build:win
            artifact_name: windows-installer
            artifact_path: dist/*.exe
          - os: ubuntu-latest
            build_script: build:linux
            artifact_name: linux-installer
            artifact_path: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build App
        run: npm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}