name: Build/Release Electron App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_script: build:mac
            artifact_name: mac-installer
            artifact_path: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            build_script: build:win
            artifact_name: windows-x64-installer
            artifact_path: |
              dist/*x64*.exe
              dist/*x64*.zip
              dist/*.exe
              dist/*.zip
          - os: windows-latest
            build_script: build:win:arm64
            artifact_name: windows-arm64-installer
            artifact_path: |
              dist/*arm64*.exe
              dist/*arm64*.zip
          - os: ubuntu-latest
            build_script: build:linux
            artifact_name: linux-installer
            artifact_path: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build App
        run: npm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
