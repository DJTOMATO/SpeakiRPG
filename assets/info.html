<style>
    .info-wrapper {
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-family: sans-serif;
    }
    .lang-row { 
        display: flex; 
        gap: 8px; 
        justify-content: center; 
        margin-bottom: 4px; 
        flex-wrap: wrap; 
    }
    .lang-btn { 
        padding: 6px 12px; 
        font-weight: bold; 
        border-radius: 6px; 
        border: 1px solid #475569; 
        background: #0f172a; 
        color: white; 
        cursor: pointer; 
        transition: 0.2s; 
    }
    .lang-btn:hover { 
        background: #1e293b !important; 
    }
    .movie-title { 
        margin: 0; 
        font-size: 24px; 
        color: #facc15; 
        text-align: center; 
        border-bottom: 1px solid #334155; 
        padding-bottom: 12px; 
    }
    .movie-desc { 
        margin: 0; 
        font-size: 16px; 
        font-weight: bold; 
        color: #cbd5e1; 
        text-align: center; 
    }
    .iframe-container { 
        position: relative; 
        width: 100%; 
        padding-bottom: 56.25%; 
        height: 0; 
        border-radius: 8px; 
        overflow: hidden; 
        border: 1px solid #334155; 
    }
    .iframe-container iframe { 
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        border: 0; 
    }
</style>

<div class="info-wrapper">
    <div class="lang-row">
        <button class="lang-btn" data-lang="en" onclick="window.setInfoLang('en')">English</button>
        <button class="lang-btn" data-lang="ja" onclick="window.setInfoLang('ja')">日本語</button>
        <button class="lang-btn" data-lang="ko" onclick="window.setInfoLang('ko')">한국어</button>
        <button class="lang-btn" data-lang="zh-TW" onclick="window.setInfoLang('zh-TW')">繁體中文</button>
        <button class="lang-btn" data-lang="zh-CN" onclick="window.setInfoLang('zh-CN')">简体中文</button>
        <button class="lang-btn" data-lang="es-419" onclick="window.setInfoLang('es-419')">Español</button>
    </div>

    <h1 id="info-title" class="movie-title">100-Day Anniversary Video!</h1>
    <p id="info-desc" class="movie-desc">Check out the special community celebration video made by PeiYu!</p>

    <div class="iframe-container">
        <iframe src="https://www.youtube.com/embed/8maLWHDOChY?autoplay=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
</div>

<script id="info-script">
window.infoLangs = {
  "en": { title: "100-Day Anniversary Video!", desc: "Check out the special community celebration video made by PeiYu!" },
  "ja": { title: "100日記念ビデオ！", desc: "PeiYuさんが制作したコミュニティの特別お祝いビデオをぜひチェックしてください！" },
  "ko": { title: "100일 기념 영상!", desc: "PeiYu님이 제작한 특별한 커뮤니티 축하 영상을 확인해보세요!" },
  "zh-TW": { title: "100 天週年紀念影片！", desc: "快來看看由 PeiYu 製作的社群特別慶祝影片！" },
  "zh-CN": { title: "100 天周年纪念视频！", desc: "快来看看由 PeiYu 制作的社区特别庆祝视频！" },
  "es-419": { title: "¡Video del 100.º Aniversario!", desc: "¡Mira el video especial de celebración de la comunidad hecho por PeiYu!" }
};

window.setInfoLang = function(lang) {
  if (lang === 'zh') lang = 'zh-CN';
  if (lang === 'es') lang = 'es-419';
  if (!window.infoLangs[lang]) lang = 'en';
  document.getElementById('info-title').innerText = window.infoLangs[lang].title;
  document.getElementById('info-desc').innerText = window.infoLangs[lang].desc;
  const btns = document.querySelectorAll('.lang-btn');
  btns.forEach(b => {
      if (b.dataset.lang === lang) {
          b.style.background = '#3b82f6';
      } else {
          b.style.background = '#0f172a';
      }
  });
};
</script>
<img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" onload="eval(document.getElementById('info-script').innerText); (function(){ let l = (typeof window.lunCurrentLang !== 'undefined' ? window.lunCurrentLang : (typeof window.spkmodLang !== 'undefined' ? window.spkmodLang : 'en')); window.setInfoLang(l); })();" style="display:none;">
